<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom: a word guessing game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e6f2ec;
    --paper-2: #d4e9df;
    --ink: #1b3a31;
    --muted: #4f6e63;
    --key: #fbfefc;
    --key-border: #a9c7b9;
    --good: #2b8150;
    --bad: #c2412f;
    --accent: #1b3a31;
    --accent-text: #e6f2ec;
    --leaf: #3fa064;
    --leaf-edge: #2b7a4b;
    --stem: #2f8a55;
    --stem-dry: #b79a6a;
    --pot: #b9583a;
    --pot-dark: #9a4429;
    --petal: #f4a3c4;
    --petal-edge: #e27aa6;
    --centre: #f6c445;
    --ground: #8fb7a3;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0f1f1a;
      --paper-2: #16302a;
      --ink: #dff0e7;
      --muted: #93b3a5;
      --key: #172a24;
      --key-border: #34584b;
      --good: #6fcf97;
      --bad: #ff8070;
      --accent: #dff0e7;
      --accent-text: #0f1f1a;
      --leaf: #4cc27a;
      --leaf-edge: #2f8f58;
      --stem: #4cb27a;
      --stem-dry: #8f7a55;
      --pot: #c9694a;
      --pot-dark: #a9503a;
      --ground: #2f5446;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0f1f1a;
    --paper-2: #16302a;
    --ink: #dff0e7;
    --muted: #93b3a5;
    --key: #172a24;
    --key-border: #34584b;
    --good: #6fcf97;
    --bad: #ff8070;
    --accent: #dff0e7;
    --accent-text: #0f1f1a;
    --leaf: #4cc27a;
    --leaf-edge: #2f8f58;
    --stem: #4cb27a;
    --stem-dry: #8f7a55;
    --pot: #c9694a;
    --pot-dark: #a9503a;
    --ground: #2f5446;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--paper);
    background-image: linear-gradient(180deg, var(--paper) 0%, var(--paper) 45%, var(--paper-2) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 560px;
    padding: 20px 16px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
  .stats { color: var(--muted); font-size: 0.9rem; text-align: right; }
  .stats b { color: var(--ink); font-weight: 800; }

  .hint {
    width: 100%;
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .hint strong { color: var(--ink); font-weight: 800; }

  svg.plant-art { width: min(62vw, 240px); height: auto; overflow: visible; }

  .plant { transform-origin: 100px 172px; transition: transform 0.9s ease-in-out; }
  .stem { fill: none; stroke: var(--stem); stroke-width: 5; stroke-linecap: round; transition: stroke 0.8s; }
  .leaf-shape { fill: var(--leaf); stroke: var(--leaf-edge); stroke-width: 2; stroke-linejoin: round; }
  .leaf-vein { fill: none; stroke: var(--leaf-edge); stroke-width: 1.5; stroke-linecap: round; }
  .leaf {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 1s ease-in, opacity 0.9s ease-in;
  }
  .leaf.off {
    opacity: 0;
    transform: translate(var(--dx), 72px) rotate(var(--rot));
  }
  /* On a win, lost leaves grow back from the stem, one after another */
  .leaf.sprout {
    transition: none;
    transform-origin: var(--ox);
    animation: leaf-sprout 0.9s ease-out calc(0.6s + var(--i) * 0.2s) both;
  }
  .leaf.sprout .leaf-shape { fill: color-mix(in srgb, var(--leaf), #c4f5a8 45%); }
  @keyframes leaf-sprout {
    0%   { opacity: 0; transform: scale(0); }
    60%  { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }

  .bud { fill: var(--petal-edge); transition: opacity 0.4s; transform-box: fill-box; transform-origin: center; }
  .flower {
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
    opacity: 0;
    transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
  }
  .petal { fill: var(--petal); stroke: var(--petal-edge); stroke-width: 1.5; }
  .centre { fill: var(--centre); }

  .pot-rim { fill: var(--pot); }
  .pot-body { fill: var(--pot); }
  .pot-shade { fill: var(--pot-dark); }
  .ground { stroke: var(--ground); stroke-width: 4; stroke-linecap: round; }

  svg.won .flower { transform: scale(1); opacity: 1; }
  svg.won .bud { opacity: 0; }
  svg.lost .plant { transform: rotate(9deg); }
  svg.lost .stem { stroke: var(--stem-dry); }
  svg.lost .bud { fill: var(--stem-dry); transform: translateY(8px) scale(0.85); }

  /* Butterflies: hidden until a win, then flutter in and hover near the flower */
  .bfly-in { visibility: hidden; }
  .wing-a { fill: var(--w1); stroke: var(--w2); stroke-width: 1; stroke-linejoin: round; }
  .wing-b { fill: var(--w2); stroke: var(--w2); stroke-width: 1; stroke-linejoin: round; }
  .bf-body { fill: var(--ink); }
  .bf-feeler { fill: none; stroke: var(--ink); stroke-width: 1; stroke-linecap: round; }
  .wings { transform-box: fill-box; transform-origin: center; }
  svg.won .bfly-in {
    visibility: visible;
    animation: bfly-in 3.4s cubic-bezier(0.45, 0, 0.35, 1) var(--d) both;
  }
  svg.won .bfly-hover {
    animation: bfly-bob 2.6s ease-in-out calc(var(--d) + 3.4s) infinite alternate;
  }
  svg.won .wings { animation: bfly-flap 0.28s ease-in-out infinite alternate; }
  @keyframes bfly-in {
    0%   { opacity: 0; transform: translate(var(--sx), var(--sy)); }
    8%   { opacity: 1; }
    30%  { transform: translate(calc(var(--sx) * 0.62), calc(var(--sy) * 0.15 - 30px)); }
    55%  { transform: translate(calc(var(--sx) * 0.32), calc(var(--sy) * 0.5 + 18px)); }
    78%  { transform: translate(calc(var(--sx) * 0.1), calc(var(--sy) * 0.12 - 12px)); }
    100% { opacity: 1; transform: translate(0, 0); }
  }
  @keyframes bfly-bob {
    from { transform: translate(-2px, 2px) rotate(-7deg); }
    to   { transform: translate(3px, -5px) rotate(7deg); }
  }
  @keyframes bfly-flap {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0.22); }
  }

  .word {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    min-height: 3.4rem;
    margin: 4px 0 0;
  }
  .slot {
    width: 2.1rem;
    height: 3rem;
    border-bottom: 4px solid var(--ink);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font-size: 2rem;
    font-weight: 800;
    text-transform: uppercase;
    line-height: 1.15;
  }
  .slot.missed { color: var(--bad); }

  .status { margin: 0; min-height: 1.5em; font-size: 1.05rem; font-weight: 500; text-align: center; }
  .status.won { color: var(--good); font-weight: 800; }
  .status.lost { color: var(--bad); font-weight: 800; }
  .misses { color: var(--muted); font-size: 0.9rem; min-height: 1.3em; margin: -6px 0 0; text-align: center; }

  .keyboard { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; width: 100%; }
  .keyboard button {
    appearance: none;
    font: inherit;
    font-weight: 800;
    text-transform: uppercase;
    font-size: 1.05rem;
    padding: 0;
    height: 2.7rem;
    border-radius: 10px;
    border: 1.5px solid var(--key-border);
    background: var(--key);
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
  }
  .keyboard button:hover:not(:disabled) { border-color: var(--ink); }
  .keyboard button:disabled { cursor: default; }
  .keyboard button.hit { background: var(--good); border-color: var(--good); color: var(--paper); }
  .keyboard button.miss { opacity: 0.35; text-decoration: line-through; }

  .new {
    appearance: none;
    font: inherit;
    font-weight: 800;
    font-size: 1rem;
    padding: 0.7rem 1.6rem;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }

  :focus-visible { outline: 3px solid var(--good); outline-offset: 2px; }

  @media (max-width: 420px) {
    .keyboard { grid-template-columns: repeat(7, 1fr); }
    .slot { width: 1.7rem; font-size: 1.7rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .plant, .leaf, .flower, .stem, .bud { transition: none; }
    svg.won .bfly-in, svg.won .bfly-hover, svg.won .wings { animation: none; }
    .leaf.sprout { animation: none; }
  }
</style>
</head>

  function decodeWords() {
    const raw = atob(_D);
    let text = "";
    for (let i = 0; i < raw.length; i++) {
      text += String.fromCharCode(raw.charCodeAt(i) ^ _K.charCodeAt(i % _K.length));
    }
    return text.split("|").flatMap(chunk => {
      const [cat, list] = chunk.split(":");
      return list.split(",").map(word => ({ word, cat }));
    });
  }
  const ALL = decodeWords();
  const MAX_MISSES = 6;

  const el = {
    word: document.getElementById("word"),
    status: document.getElementById("status"),
    misses: document.getElementById("misses"),
    leafCount: document.getElementById("leafCount"),
    category: document.getElementById("category"),
    keyboard: document.getElementById("keyboard"),
    art: document.getElementById("art"),
    stats: document.getElementById("stats"),
    newGame: document.getElementById("newGame")
  };
  const leaves = el.art.querySelectorAll(".leaf");
  leaves.forEach((leaf, i) => {
    leaf.style.setProperty("--i", i);
    // even leaves sit on the left of the stem, odd on the right: grow from the stem side
    leaf.style.setProperty("--ox", i % 2 === 0 ? "100% 90%" : "0% 90%");
  });

  let current, guessed, wrong, over, lastWord = "";
  let stats = { wins: 0, losses: 0, streak: 0 };

  try {
    const saved = JSON.parse(localStorage.getItem("bloom-stats") || "null");
    if (saved && typeof saved.wins === "number") stats = saved;
  } catch (e) { /* storage unavailable: keep defaults */ }

  function saveStats() {
    try { localStorage.setItem("bloom-stats", JSON.stringify(stats)); } catch (e) {}
  }

  function renderStats() {
    el.stats.innerHTML = `Bloomed <b>${stats.wins}</b> &nbsp; Wilted <b>${stats.losses}</b> &nbsp; Streak <b>${stats.streak}</b>`;
  }

  function buildKeyboard() {
    el.keyboard.innerHTML = "";
    for (const ch of "abcdefghijklmnopqrstuvwxyz") {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = ch;
      b.dataset.letter = ch;
      b.setAttribute("aria-label", "Guess " + ch);
      b.addEventListener("click", () => guess(ch));
      el.keyboard.appendChild(b);
    }
  }

  function start() {
    let pick;
    do { pick = ALL[Math.floor(Math.random() * ALL.length)]; } while (pick.word === lastWord);
    current = pick;
    lastWord = pick.word;
    guessed = new Set();
    wrong = 0;
    over = false;
    el.category.textContent = pick.cat;
    el.art.classList.remove("won", "lost");
    el.status.className = "status";
    el.status.textContent = "Pick a letter to keep the plant healthy.";
    el.newGame.textContent = "New word";
    buildKeyboard();
    render();
  }

  function render() {
    el.word.innerHTML = "";
    for (const ch of current.word) {
      const s = document.createElement("span");
      s.className = "slot";
      if (guessed.has(ch)) s.textContent = ch;
      else if (over) { s.textContent = ch; s.classList.add("missed"); }
      el.word.appendChild(s);
    }
    el.keyboard.querySelectorAll("button").forEach(b => {
      const l = b.dataset.letter;
      const used = guessed.has(l);
      b.disabled = used || over;
      b.classList.toggle("hit", used && current.word.includes(l));
      b.classList.toggle("miss", used && !current.word.includes(l));
    });
    const won = el.art.classList.contains("won");
    leaves.forEach((leaf, i) => {
      const lost = i < wrong;
      leaf.classList.toggle("off", lost && !won);
      leaf.classList.toggle("sprout", lost && won);
    });
    el.leafCount.textContent = won ? MAX_MISSES : MAX_MISSES - wrong;
    const missed = [...guessed].filter(l => !current.word.includes(l));
    el.misses.textContent = missed.length ? "Missed: " + missed.join(" ").toUpperCase() : "";
  }

  function guess(letter) {
    if (over || guessed.has(letter)) return;
    guessed.add(letter);
    if (!current.word.includes(letter)) wrong++;

    const solved = [...current.word].every(c => guessed.has(c));
    if (solved) {
      over = true;
      stats.wins++; stats.streak++;
      el.art.classList.add("won");
      el.status.className = "status won";
      el.status.textContent = "It bloomed! The word was " + current.word + ".";
      el.newGame.textContent = "Plant another";
      saveStats(); renderStats();
    } else if (wrong >= MAX_MISSES) {
      over = true;
      stats.losses++; stats.streak = 0;
      el.art.classList.add("lost");
      el.status.className = "status lost";
      el.status.textContent = "The plant wilted. The word was " + current.word + ".";
      el.newGame.textContent = "Try again";
      saveStats(); renderStats();
    } else {
      const left = MAX_MISSES - wrong;
      el.status.textContent = current.word.includes(letter)
        ? "Yes, there's a " + letter.toUpperCase() + "."
        : "No " + letter.toUpperCase() + ". " + left + (left === 1 ? " leaf" : " leaves") + " left.";
    }
    render();
    if (over) el.newGame.focus();
  }

  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[a-z]$/i.test(e.key)) guess(e.key.toLowerCase());
  });
  el.newGame.addEventListener("click", start);

  renderStats();
  start();
</script>
