<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom: a word guessing game</title>
<style>
  :root {
    --paper: #e6f2ec;
    --paper-2: #d4e9df;
    --ink: #1b3a31;
    --muted: #4f6e63;
    --key: #fbfefc;
    --key-border: #a9c7b9;
    --good: #2b8150;
    --bad: #c2412f;
    --accent: #1b3a31;
    --accent-text: #e6f2ec;
    --leaf: #3fa064;
    --leaf-edge: #2b7a4b;
    --stem: #2f8a55;
    --stem-dry: #b79a6a;
    --pot: #b9583a;
    --pot-dark: #9a4429;
    --petal: #f4a3c4;
    --petal-edge: #e27aa6;
    --centre: #f6c445;
    --ground: #8fb7a3;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0f1f1a;
      --paper-2: #16302a;
      --ink: #dff0e7;
      --muted: #93b3a5;
      --key: #172a24;
      --key-border: #34584b;
      --good: #6fcf97;
      --bad: #ff8070;
      --accent: #dff0e7;
      --accent-text: #0f1f1a;
      --leaf: #4cc27a;
      --leaf-edge: #2f8f58;
      --stem: #4cb27a;
      --stem-dry: #8f7a55;
      --pot: #c9694a;
      --pot-dark: #a9503a;
      --ground: #2f5446;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0f1f1a;
    --paper-2: #16302a;
    --ink: #dff0e7;
    --muted: #93b3a5;
    --key: #172a24;
    --key-border: #34584b;
    --good: #6fcf97;
    --bad: #ff8070;
    --accent: #dff0e7;
    --accent-text: #0f1f1a;
    --leaf: #4cc27a;
    --leaf-edge: #2f8f58;
    --stem: #4cb27a;
    --stem-dry: #8f7a55;
    --pot: #c9694a;
    --pot-dark: #a9503a;
    --ground: #2f5446;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--paper);
    background-image: linear-gradient(180deg, var(--paper) 0%, var(--paper) 45%, var(--paper-2) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 560px;
    padding: 20px 16px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
  .stats { color: var(--muted); font-size: 0.9rem; text-align: right; }
  .stats b { color: var(--ink); font-weight: 800; }

  .hint {
    width: 100%;
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .hint strong { color: var(--ink); font-weight: 800; }

  svg.plant-art { width: min(62vw, 240px); height: auto; overflow: visible; }

  .plant { transform-origin: 100px 172px; transition: transform 0.9s ease-in-out; }
  .stem { fill: none; stroke: var(--stem); stroke-width: 5; stroke-linecap: round; transition: stroke 0.8s; }
  .leaf-shape { fill: var(--leaf); stroke: var(--leaf-edge); stroke-width: 2; stroke-linejoin: round; }
  .leaf-vein { fill: none; stroke: var(--leaf-edge); stroke-width: 1.5; stroke-linecap: round; }
  .leaf {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 1s ease-in, opacity 0.9s ease-in;
  }
  .leaf.off {
    opacity: 0;
    transform: translate(var(--dx), 72px) rotate(var(--rot));
  }
  /* On a win, lost leaves grow back from the stem, one after another */
  .leaf.sprout {
    transition: none;
    transform-origin: var(--ox);
    animation: leaf-sprout 0.9s ease-out calc(0.6s + var(--i) * 0.2s) both;
  }
  .leaf.sprout .leaf-shape { fill: color-mix(in srgb, var(--leaf), #c4f5a8 45%); }
  @keyframes leaf-sprout {
    0%   { opacity: 0; transform: scale(0); }
    60%  { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }

  .bud { fill: var(--petal-edge); transition: opacity 0.4s; transform-box: fill-box; transform-origin: center; }
  .flower {
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
    opacity: 0;
    transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
  }
  .petal { fill: var(--petal); stroke: var(--petal-edge); stroke-width: 1.5; }
  .centre { fill: var(--centre); }

  .pot-rim { fill: var(--pot); }
  .pot-body { fill: var(--pot); }
  .pot-shade { fill: var(--pot-dark); }
  .ground { stroke: var(--ground); stroke-width: 4; stroke-linecap: round; }

  svg.won .flower { transform: scale(1); opacity: 1; }
  svg.won .bud { opacity: 0; }
  svg.lost .plant { transform: rotate(9deg); }
  svg.lost .stem { stroke: var(--stem-dry); }
  svg.lost .bud { fill: var(--stem-dry); transform: translateY(8px) scale(0.85); }

  /* Butterflies: hidden until a win, then flutter in and hover near the flower */
  .bfly-in { visibility: hidden; }
  .wing-a { fill: var(--w1); stroke: var(--w2); stroke-width: 1; stroke-linejoin: round; }
  .wing-b { fill: var(--w2); stroke: var(--w2); stroke-width: 1; stroke-linejoin: round; }
  .bf-body { fill: var(--ink); }
  .bf-feeler { fill: none; stroke: var(--ink); stroke-width: 1; stroke-linecap: round; }
  .wings { transform-box: fill-box; transform-origin: center; }
  svg.won .bfly-in {
    visibility: visible;
    animation: bfly-in 3.4s cubic-bezier(0.45, 0, 0.35, 1) var(--d) both;
  }
  svg.won .bfly-hover {
    animation: bfly-bob 2.6s ease-in-out calc(var(--d) + 3.4s) infinite alternate;
  }
  svg.won .wings { animation: bfly-flap 0.28s ease-in-out infinite alternate; animation-delay: var(--flap-delay, 0s); }
  @keyframes bfly-in {
    0%   { opacity: 0; transform: translate(var(--sx), var(--sy)); }
    8%   { opacity: 1; }
    30%  { transform: translate(calc(var(--sx) * 0.62), calc(var(--sy) * 0.15 - 30px)); }
    55%  { transform: translate(calc(var(--sx) * 0.32), calc(var(--sy) * 0.5 + 18px)); }
    78%  { transform: translate(calc(var(--sx) * 0.1), calc(var(--sy) * 0.12 - 12px)); }
    100% { opacity: 1; transform: translate(0, 0); }
  }
  @keyframes bfly-bob {
    from { transform: translate(-2px, 2px) rotate(-7deg); }
    to   { transform: translate(3px, -5px) rotate(7deg); }
  }
  @keyframes bfly-flap {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0.22); }
  }
  .bee-flight { visibility: hidden; }
  svg.won .bee-flight { visibility: visible; animation: bee-visit 5s ease-in-out 0.4s both; }
  .bee-wings { transform-box: fill-box; transform-origin: center; }
  svg.won .bee-wings { animation: bfly-flap 0.11s ease-in-out infinite alternate; animation-delay: var(--bee-flap-delay, 0s); }
  .bee-body { fill: #f6c445; stroke: #8c5b20; stroke-width: 1.5; }
  .bee-stripe { stroke: #503b2b; stroke-width: 3; stroke-linecap: round; }
  .bee-wing { fill: #e8f7f0; fill-opacity: 0.9; stroke: #91b9a8; stroke-width: 1; }
  @keyframes bee-visit {
    0% { opacity: 0; transform: translate(175px, 115px) scale(0.7); }
    12% { opacity: 1; }
    35% { transform: translate(130px, 72px) scale(1); }
    58% { transform: translate(75px, 88px) scale(0.95); }
    78% { transform: translate(126px, 118px) scale(0.9); }
    100% { opacity: 1; transform: translate(100px, 62px) scale(0.9); }
  }

  .word {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    gap: var(--slot-gap, 8px);
    width: 100%;
    min-height: 3.4rem;
    margin: 4px 0 0;
  }
  .slot {
    flex: none;
    width: var(--slot-w, 34px);
    height: var(--slot-h, 48px);
    border-bottom: var(--slot-line, 4px) solid var(--ink);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font-size: var(--slot-font, 32px);
    font-weight: 800;
    text-transform: uppercase;
    line-height: 1.15;
  }
  .slot.missed { color: var(--bad); }

  .status { margin: 0; min-height: 1.5em; font-size: 1.05rem; font-weight: 500; text-align: center; }
  .status.won { color: var(--good); font-weight: 800; }
  .status.lost { color: var(--bad); font-weight: 800; }
  .misses { color: var(--muted); font-size: 0.9rem; min-height: 1.3em; margin: -6px 0 0; text-align: center; }
  #debugWord { cursor: pointer; }
  #debugWord:hover { color: var(--ink); }
  .word-list-button {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 0.9em; padding: 0 2px; cursor: pointer;
    vertical-align: baseline;
  }
  .word-list-button:hover { color: var(--ink); }
  #debugRecentWords { width: 100%; color: var(--muted); font-size: 0.85rem; }
  #debugRecentWords h2 { margin: 0 0 6px; color: var(--ink); font-size: 0.95rem; }
  #debugRecentWords p { margin: 0; max-height: 180px; overflow-y: auto; overflow-wrap: anywhere; line-height: 1.6; }

  .keyboard { width: 100%; }
  .keyboard.layout-abc { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
  .keyboard.layout-qwerty { display: flex; flex-direction: column; gap: 6px; }
  .krow { display: flex; gap: 6px; margin: 0 auto; }
  .krow button { flex: 1 1 0; min-width: 0; }
  .krow.r1 { width: 100%; }
  .krow.r2 { width: 90%; }
  .krow.r3 { width: 80%; }
  .keyboard button {
    appearance: none;
    font: inherit;
    font-weight: 800;
    text-transform: uppercase;
    font-size: 1.05rem;
    padding: 0;
    height: 2.7rem;
    border-radius: 10px;
    border: 1.5px solid var(--key-border);
    background: var(--key);
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
  }
  .keyboard button:hover:not(:disabled) { border-color: var(--ink); }
  .keyboard button:disabled { cursor: default; }
  .keyboard button.hit { background: var(--good); border-color: var(--good); color: var(--paper); }
  .keyboard button.miss { opacity: 0.35; text-decoration: line-through; }
  .keyboard button.keyswap {
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    border-style: dashed;
    background: transparent;
    color: var(--muted);
  }
  .keyboard button.keyswap:hover { color: var(--ink); border-color: var(--ink); }

  .new {
    appearance: none;
    font: inherit;
    font-weight: 800;
    font-size: 1rem;
    padding: 0.7rem 1.6rem;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }

  .game-actions { width: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
  .version { position: absolute; right: 0; color: var(--muted); font-size: 0.7rem; opacity: 0.8; }
  :focus-visible { outline: 3px solid var(--good); outline-offset: 2px; }

  @media (max-width: 420px) {
    .keyboard.layout-abc { grid-template-columns: repeat(7, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .plant, .leaf, .flower, .stem, .bud { transition: none; }
    svg.won .bfly-in, svg.won .bfly-hover, svg.won .wings { animation: none; }
    svg.won .bee-flight { animation: none; opacity: 1; transform: translate(100px, 80px); }
    svg.won .bee-wings { animation: none; }
    .leaf.sprout { animation: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Bloom</h1>
    <div class="stats" id="stats" aria-label="Your record">Bloomed <b>14</b> &nbsp; Wilted <b>1</b> &nbsp; Streak <b>12</b></div>
  </header>

  <div class="hint">

  </div>

  <svg class="plant-art won" id="art" viewBox="0 0 200 230" role="img" aria-label="A potted plant with six leaves">

        <ellipse class="petal" cx="100" cy="46" rx="8" ry="15" transform="rotate(315 100 62)"></ellipse>
        <circle class="centre" cx="100" cy="62" r="9"></circle>

  function fitWord() {

    set("--slot-h", (H * s).toFixed(2) + "px");
    set("--slot-gap", (GAP * s).toFixed(2) + "px");
    set("--slot-font", (FONT * s).toFixed(2) + "px");
    set("--slot-line", Math.max(2, LINE * s).toFixed(2) + "px");
  }

  function render() {
    el.word.innerHTML = "";
    for (const ch of current.word) {
      const s = document.createElement("span");
      s.className = "slot";
      if (guessed.has(ch)) s.textContent = ch;
      else if (over) { s.textContent = ch; s.classList.add("missed"); }
      el.word.appendChild(s);
    }
    fitWord();
    el.keyboard.querySelectorAll("button[data-letter]").forEach(b => {
      const l = b.dataset.letter;
      const used = guessed.has(l);
      b.disabled = used || over;
      b.classList.toggle("hit", used && current.word.includes(l));
      b.classList.toggle("miss", used && !current.word.includes(l));
    });
    const won = el.art.classList.contains("won");
    leaves.forEach((leaf, i) => {
      const lost = i < wrong;
      leaf.classList.toggle("off", lost && !won);
      leaf.classList.toggle("sprout", lost && won);
    });
    el.leafCount.textContent = won ? MAX_MISSES : MAX_MISSES - wrong;
    const missed = [...guessed].filter(l => !current.word.includes(l));
    el.misses.textContent = missed.length ? "Missed: " + missed.join(" ").toUpperCase() : "";
    if (!over && !giveUpArmed) el.newGame.textContent = guessed.size > 0 ? "Give up" : "New word";
    if (el.recentWordCount) el.recentWordCount.textContent = "(" + recentWords.length + "/" + RECENT_WORDS_LIMIT + ")";
    if (el.recentWordList) el.recentWordList.textContent = recentWords.join(", ");
  }

  // One butterfly per win in the current streak (capped so the scene stays readable)
  const BF_MAX = 24;
  const BF_COLOURS = [
    ["#f8a64a", "#d9622b"], ["#7db4f7", "#3f77c9"], ["#f7e26b", "#d1a31f"],
    ["#d59cf0", "#9a4fc4"], ["#ff8fa3", "#d6455f"], ["#8be0b5", "#2f9c6b"]
  ];
  const BF_ART =
    '<g class="bfly-hover"><g class="wings">' +
    '<g><path class="wing-a" d="M0 -1 C4 -16 20 -20 22 -8 C22 -2 10 2 0 0 Z"/><path class="wing-b" d="M0 1 C10 3 18 6 14 14 C10 20 2 12 0 2 Z"/></g>' +
    '<g transform="scale(-1 1)"><path class="wing-a" d="M0 -1 C4 -16 20 -20 22 -8 C22 -2 10 2 0 0 Z"/><path class="wing-b" d="M0 1 C10 3 18 6 14 14 C10 20 2 12 0 2 Z"/></g>' +
    '</g>' +
    '<ellipse class="bf-body" cx="0" cy="2" rx="1.8" ry="8"/>' +
    '<circle class="bf-body" cx="0" cy="-7" r="2"/>' +
    '<path class="bf-feeler" d="M0 -8 Q-3 -14 -6 -15 M0 -8 Q3 -14 6 -15"/>' +
    '</g>';

  function spawnButterflies(streak) {
    const n = Math.min(streak, BF_MAX);
    const scale = Math.max(0.5, 0.9 - n * 0.02);
    let html = "";
    for (let k = 0; k < n; k++) {
      // spread them around the flower on a spiral
      const ang = -0.6 + k * 2.399;
      const r = 40 + 16 * Math.sqrt(k);
      const x = Math.min(188, Math.max(12, 100 + r * Math.cos(ang) * 1.2));
      const y = Math.min(150, Math.max(10, 70 + r * Math.sin(ang) * 0.85));
      const sx = (x >= 100 ? 1 : -1) * (110 + (k * 17) % 50);
      const sy = -50 + (k * 29) % 90;
      const delay = 0.5 + Math.min(k * 0.3, 4);
      const flapDelay = -Math.random() * 0.28;
      const c = BF_COLOURS[k % BF_COLOURS.length];
      html += '<g transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') scale(' + scale.toFixed(2) + ')">' +
        '<g class="bfly-in" style="--sx:' + sx + 'px;--sy:' + sy + 'px;--d:' + delay.toFixed(2) + 's;--w1:' + c[0] + ';--w2:' + c[1] + ';--flap-delay:' + flapDelay.toFixed(3) + 's">' +
        BF_ART + '</g></g>';
    }
    el.butterflies.innerHTML = html;
  }

  function spawnPerfectBee() {
    const bee = document.createElementNS("http://www.w3.org/2000/svg", "g");
    bee.setAttribute("class", "bee-flight");
    bee.innerHTML = '<g class="bee-wings" style="--bee-flap-delay:' + (-Math.random() * 0.11).toFixed(3) + 's">' +
      '<ellipse class="bee-wing" cx="-5" cy="-7" rx="5" ry="8" transform="rotate(-30 -5 -7)"/>' +
      '<ellipse class="bee-wing" cx="5" cy="-7" rx="5" ry="8" transform="rotate(30 5 -7)"/>' +
      '</g><ellipse class="bee-body" cx="0" cy="0" rx="9" ry="6"/>' +
      '<path class="bee-stripe" d="M-3 -5 Q-5 0 -3 5 M3 -5 Q1 0 3 5"/>' +
      '<circle cx="8" cy="-1" r="1" fill="#1b3a31"/>';
    el.butterflies.appendChild(bee);
  }

  function openWordList() {
    if (!DEBUG) return;
    const page = window.open("", "_blank");
    if (!page) return;
    const grouped = new Map();
    for (const entry of ALL) {
      if (!grouped.has(entry.cat)) grouped.set(entry.cat, []);
      grouped.get(entry.cat).push(entry.word);
    }
    const escapeHTML = value => String(value).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
    const totalWords = [...grouped.values()].reduce((sum, words) => sum + words.length, 0);
    const sections = [...grouped].map(([category, words]) =>
      "<section><h2>" + escapeHTML(category) + " <span class=\"count\">(" + words.length + " words)</span></h2><p>" +
      words.map(escapeHTML).join(", ") + "</p></section>"
    ).join("");
    page.document.write("<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Bloom word list</title><style>body{max-width:760px;margin:40px auto;padding:0 20px;background:#e6f2ec;color:#1b3a31;font:16px system-ui,sans-serif}h1{margin-bottom:8px}.total{color:#4f6e63;margin:0 0 24px}section{padding:12px 0;border-bottom:1px solid #a9c7b9}h2{margin:0 0 6px;font-size:1.15rem}.count{font-size:.9rem;font-weight:400;color:#4f6e63}p{margin:0;line-height:1.7}</style></head><body><h1>Bloom word list</h1><p class=\"total\">Total: " + totalWords + " words across " + grouped.size + " categories</p>" + sections + "</body></html>");
    page.document.close();
  }

  function guess(letter) {
    if (over || guessed.has(letter)) return;
    if (giveUpArmed) { giveUpArmed = false; clearTimeout(giveUpTimer); }
    guessed.add(letter);
    if (!current.word.includes(letter)) wrong++;

    const solved = [...current.word].every(c => guessed.has(c));
    if (solved) {
      over = true;
      stats.wins++; stats.streak++;
      spawnButterflies(stats.streak);
      if (wrong === 0) spawnPerfectBee();
      el.art.classList.add("won");
      el.status.className = "status won";
      el.status.textContent = "It bloomed! The word was " + current.word + "." +
        (stats.streak > 1 ? " " + stats.streak + " in a row." : "");
      el.newGame.textContent = "Plant another";
      saveStats(); renderStats();
    } else if (wrong >= MAX_MISSES) {
      over = true;
      stats.losses++; stats.streak = 0;
      el.art.classList.add("lost");
      el.status.className = "status lost";
      el.status.textContent = "The plant wilted. The word was " + current.word + ".";
      el.newGame.textContent = "Try again";
      saveStats(); renderStats();
    } else {
      const left = MAX_MISSES - wrong;
      el.status.textContent = current.word.includes(letter)
        ? "Yes, there's a " + letter.toUpperCase() + "."
        : "No " + letter.toUpperCase() + ". " + left + (left === 1 ? " leaf" : " leaves") + " left.";
    }
    render();
    saveGame();
    if (over) el.newGame.focus();
  }

  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[a-z]$/i.test(e.key)) guess(e.key.toLowerCase());
  });
  el.newGame.addEventListener("click", onNewGame);
  el.debugWord.addEventListener("click", revealDebugWord);
  document.getElementById("wordListButton").addEventListener("click", event => {
    event.stopPropagation();
    openWordList();
  });
  window.addEventListener("resize", fitWord); // also fires on rotate

  renderStats();
  start(loadGame());
</script>


</body></html>
