<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock & Timer</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #top_left {
            font-size: 3rem;
            position: absolute;
            top: 1px;
            left: 5px;
            text-align: left;
        }

        #content_left {
            font-size: 3rem;
            position: absolute;
            top: 50px;
            left: 5px;
            text-align: left;
        }
        
        #content_right {
            font-size: 3rem;
            position: absolute;
            top: 50px;
            right: 5px;
            text-align: right;
        }
        
        #clock {
            font-size: 3rem;
            position: absolute;
            top: 1px;
            right: 5px;
            text-align: right;
        }
        
        #timer {
            font-size: 5rem;
            padding: 50px;
            margin: 20px 0;
        }
        #frame_label {
            font-size: 4rem;
            margin: 20px 0;
        }
        .flabel {
            font-size: 0.6em;
            margin: 0px 0;
        }
        .buttons {
            display: flex;
            gap: 10px;
        }
        button {
            font-size: 1.5rem;
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #28a745;
            color: white;
        }
        input {
            font-size: 1.5rem;
            padding: 5px 15px;
            cursor: pointer;
            border: none;
            background-color: #333;
            color: white;
            width: 10%;
            margin: 1px;
        }
        button:disabled {
            background-color: #555;
        }
        #stop {
            background-color: #dc3545;
        }
        #finish_frame {
            background-color: #2805ff;
        }
        #plus_minus {
            background-color: #484848;
        }

        #menu_btn {
            position: fixed;
            bottom: 10px;
            left: 10px;
            width: 50px;
            height: 50px;
            padding: 0;
            font-size: 2rem;
            line-height: 50px;
            background-color: #484848;
            z-index: 10;
        }
        #menu_popup {
            display: none;
            position: fixed;
            bottom: 70px;
            left: 10px;
            background-color: #333;
            border: 1px solid #555;
            border-radius: 5px;
            overflow: hidden;
            z-index: 10;
        }
        #menu_popup.open {
            display: block;
        }
        #menu_popup div {
            font-size: 1.5rem;
            padding: 12px 25px;
            cursor: pointer;
            text-align: left;
        }
        #menu_popup div:hover, #menu_popup div:active {
            background-color: #484848;
        }

        dialog {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 25px 30px;
            max-width: 420px;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.65);
        }
        #dlg_title {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        #dlg_msg {
            font-size: 1.3rem;
            margin-bottom: 25px;
        }
        #dlg_buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        #dlg_cancel {
            background-color: #484848;
        }
    </style>
</head>
<body>
    <div>
      <div id="top_left">
          <div class="buttons">
              <button id="start" onclick="startTimer()">Start</button>
              <button id="stop" onclick="stopTimer()" disabled>Stop</button>
              <button id="finish_frame" onclick="finishFrame()">Finish Frame</button>
              <button id="plus_minus" onclick="change_frame(-1)">F-</button>
              <button id="plus_minus" onclick="change_frame(+1)">F+</button>
              <button id="plus_minus" onclick="change_time(-60)">T-</button>
              <button id="plus_minus" onclick="change_time(+60)">T+</button>
           </div>
      </div>
      <div id="clock">00:00</div>
    </div>
    <div>
        <div id="content_left">
            <div id="frame_label">Frame: 1</div>
            <div id="timer">00:00</div>
        </div>
        <div id="content_right">
            <div>
                 <label class="flabel" id="f1" name="f1"></label><input type="text" inputmode = "numeric" enterkeyhint="done" id="bf1" name="bf1">
                 <label class="flabel" id="f6" name="f6"></label><input type="text" inputmode = "numeric" enterkeyhint="done" id="bf6" name="bf1">
            </div>

            <div>
                 <label class="flabel" id="f2" name="f2"></label><input type="text" inputmode = "numeric" enterkeyhint="done" id="bf2" name="bf2">
                 <label class="flabel" id="f7" name="f7"></label><input type="text" inputmode = "numeric" enterkeyhint="done" id="bf7" name="bf7">
            </div>

            <div>
                 <label class="flabel" id="f3" name="f3"></label><input type="text" inputmode = "numeric" enterkeyhint="done" id="bf3" name="bf3">
                 <label class="flabel" id="f8" name="f8"></label><input type="text" inputmode = "numeric" enterkeyhint="done" id="bf8" name="bf8">
            </div>

            <div>
                 <label class="flabel" id="f4" name="f4"></label><input type="text" inputmode = "numeric" enterkeyhint="done" id="bf4" name="bf4">
                 <label class="flabel" id="f9" name="f9"></label><input type="text" inputmode = "numeric" enterkeyhint="done" id="bf9" name="bf9">
            </div>

            <div>
                 <label class="flabel" id="f5" name="f5"></label><input type="text" inputmode = "numeric" enterkeyhint="done" id="bf5" name="bf5">
                 <label class="flabel" id="f10" name="f10"></label><input type="text" inputmode = "numeric" enterkeyhint="done" id="bf10" name="bf10">
            </div>

        </div>
        
    </div>
    <button id="menu_btn" onclick="toggleMenu(event)" aria-label="Menu">&#9776;</button>
    <div id="menu_popup">
        <div onclick="menuClear()">Clear...</div>
        <div onclick="menuSave()">Save...</div>
    </div>
    <dialog id="dlg">
        <div id="dlg_title"></div>
        <div id="dlg_msg"></div>
        <div id="dlg_buttons">
            <button id="dlg_cancel">Cancel</button>
            <button id="dlg_ok">OK</button>
        </div>
    </dialog>
    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        let timer;
        let time = 0;
        let frame=1;
        function updateTimerDisplay() {
            const minutes = String(Math.floor(time / 60)).padStart(2, '0');
            const seconds = String(time % 60).padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }
        function startTimer() {
            document.getElementById('start').disabled = true;
            document.getElementById('stop').disabled = false;
            timer = setInterval(() => {
                time++;
                updateTimerDisplay();
            }, 1000);
        }
        function stopTimer() {
            clearInterval(timer);
            document.getElementById('start').disabled = false;
            document.getElementById('stop').disabled = true;
        }
        function finishFrame() {
         stopTimer();
         
         // Update textbox with frame time
         if (frame<11)
         {
          document.getElementById('f'+frame).innerHTML ='F '+frame+' '+ document.getElementById('timer').textContent
         }
         
         // Increase frame number
         frame=frame+1;
         document.getElementById('frame_label').textContent = `Frame: ${frame}`;         
         
         // Reset timer and restart
         time=0;
         updateTimerDisplay();
         startTimer();
        }

        function change_frame(i) {
         frame=frame+i;
         if (frame<1) frame=1;
         document.getElementById('frame_label').textContent = `Frame: ${frame}`;         
        }

        function change_time(i) {
         time=time+i;
         if (time<0) time=0;
         updateTimerDisplay();
        }
                
        // Burger menu
        function toggleMenu(e) {
            e.stopPropagation();
            document.getElementById('menu_popup').classList.toggle('open');
        }
        function closeMenu() {
            document.getElementById('menu_popup').classList.remove('open');
        }
        document.addEventListener('click', closeMenu);

        // Custom dialog (replaces browser confirm/alert)
        function showDialog({title, message, okText = 'OK', okColor = '#28a745', cancelText = null, onOk = null}) {
            const dlg = document.getElementById('dlg');
            const ok = document.getElementById('dlg_ok');
            const cancel = document.getElementById('dlg_cancel');
            document.getElementById('dlg_title').textContent = title;
            document.getElementById('dlg_msg').textContent = message;
            ok.textContent = okText;
            ok.style.backgroundColor = okColor;
            ok.onclick = () => { dlg.close(); if (onOk) onOk(); };
            cancel.style.display = cancelText ? '' : 'none';
            cancel.textContent = cancelText || '';
            cancel.onclick = () => dlg.close();
            dlg.showModal();
        }

        function menuClear() {
            closeMenu();
            showDialog({
                title: 'Clear everything?',
                message: 'This resets the timer, frame number and all frame times.',
                okText: 'Clear',
                okColor: '#dc3545',
                cancelText: 'Cancel',
                onOk: doClear
            });
        }
        function doClear() {
            stopTimer();
            time = 0;
            frame = 1;
            updateTimerDisplay();
            document.getElementById('frame_label').textContent = 'Frame: 1';
            for (let i = 1; i <= 10; i++) {
                document.getElementById('f' + i).innerHTML = '';
                document.getElementById('bf' + i).value = '';
            }
        }
        function menuSave() {
            closeMenu();
            showDialog({
                title: 'Save',
                message: 'Not implemented yet (placeholder).'
            });
        }

        // Prevent phone from sleeping
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {
                console.error(`Wake Lock error: ${err.name}, ${err.message}`);
            }
            console.log("run waitlock");
        }
        document.addEventListener("visibilitychange", async () => {
            if (wakeLock !== null && document.visibilityState === "visible") {
                await requestWakeLock();
            }
        });
        requestWakeLock();
        
    </script>
</body>
</html>
